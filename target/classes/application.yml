  spring:
    application:
      name: GreenexProject
    config:
      import: "optional:file:.env[.properties]"

    datasource:
      url: jdbc:postgresql://localhost:5432/greenexdb
      username: ${DB_USERNAME}
      password: ${PASSWORD}
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  server:
    port: 8888

  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
